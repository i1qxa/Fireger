<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Firebase Manager</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 12px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    h2 { font-size: 1rem; margin: 16px 0 8px; }
    input[type="text"], input[type="file"], select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 100%; }
    input[type="file"] { width: 100%; }
    .add-row { margin-bottom: 10px; }
    .add-row label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--tg-theme-hint-color, #666); }
    button { padding: 10px 16px; font-size: 14px; border: none; border-radius: 8px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .card { background: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .project-item { padding: 10px; margin: 6px 0; background: var(--tg-theme-bg-color, #fff); border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
    .project-item.selected { border-color: var(--tg-theme-button-color, #2481cc); }
    .field-row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .field-row input { flex: 1; min-width: 100px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    .field-block { margin-bottom: 16px; }
    .field-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; display: block; }
    .field-block textarea { width: 100%; min-height: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: inherit; resize: vertical; box-sizing: border-box; }
    .field-actions { display: flex; flex-direction: row; gap: 10px; margin-top: 8px; }
    .field-actions .btn-save { background: #2e7d32; color: #fff; }
    .field-actions .btn-clear { background: #c62828; color: #fff; margin-left: auto; }
    .rules-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
    .rules-row .rules-status { font-weight: 600; }
    .rules-status--ok { color: #2e7d32; }
    .rules-status--deny { color: #c62828; }
    .btn-delete-project { background: #c62828; color: #fff; margin-top: 16px; width: 100%; }
    .loading-spinner { width: 28px; height: 28px; border: 3px solid var(--tg-theme-hint-color, #ccc); border-top-color: var(--tg-theme-button-color, #2481cc); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .block-loading { display: flex; align-items: center; gap: 10px; padding: 12px 0; color: var(--tg-theme-hint-color, #666); }
    .error { color: #c00; font-size: 14px; margin-top: 8px; }
    .status { font-size: 13px; color: var(--tg-theme-hint-color, #666); margin-left: 8px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .filter-row label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
    .filter-row input[type="checkbox"] { width: 18px; height: 18px; }
    .view { display: none; }
    .view.active { display: block; }
    .add-project-btn { width: 100%; margin-top: 12px; padding: 12px; }
    .empty-state { text-align: center; padding: 24px 12px; color: var(--tg-theme-hint-color, #666); }
  </style>
</head>
<body>
  <h1>Firebase Manager</h1>
  <p class="status" id="status"></p>

  <!-- Экран списка проектов -->
  <div id="listView" class="view active">
    <div class="card">
      <h2>Фильтр по статусу</h2>
      <div class="filter-row" id="statusFilter">
        <label><input type="checkbox" name="statusFilter" value="Development" checked> Development</label>
        <label><input type="checkbox" name="statusFilter" value="Ready" checked> Ready</label>
        <label><input type="checkbox" name="statusFilter" value="Moderation" checked> Moderation</label>
        <label><input type="checkbox" name="statusFilter" value="Product" checked> Product</label>
        <label><input type="checkbox" name="statusFilter" value="Ban" checked> Ban</label>
      </div>
    </div>
    <div class="card" id="projectsCard">
      <h2>Проекты</h2>
      <div id="projectsList"></div>
      <div id="emptyState" class="empty-state" style="display: none;">Нет проектов, удовлетворяющих текущему фильтру.</div>
    </div>
    <button id="goToAddBtn" class="add-project-btn">Добавить проект</button>
  </div>

  <!-- Экран создания проекта -->
  <div id="createView" class="view">
    <div class="card">
      <h2>Новый проект</h2>
      <div class="add-row">
        <label for="bundleIdInput">Bundle ID Android-приложения</label>
        <input type="text" id="bundleIdInput" placeholder="Например: com.example.myapp">
      </div>
      <div class="add-row">
        <label for="nameInput">Название</label>
        <input type="text" id="nameInput" placeholder="Название проекта">
      </div>
      <div class="add-row">
        <label for="notionInput">Notion (ссылка)</label>
        <input type="text" id="notionInput" placeholder="https://...">
      </div>
      <div class="add-row">
        <label for="statusSelect">Статус</label>
        <select id="statusSelect">
          <option value="Development">Development</option>
          <option value="Ready">Ready</option>
          <option value="Moderation">Moderation</option>
          <option value="Product">Product</option>
          <option value="Ban">Ban</option>
        </select>
      </div>
      <div class="add-row">
        <label for="keyFileInput">Файл ключа (JSON)</label>
        <input type="file" id="keyFileInput" accept=".json,application/json">
      </div>
      <button id="addKeyBtn" style="margin-top: 8px;">Добавить</button>
      <button id="backFromCreateBtn" style="margin-top: 8px; margin-left: 8px; background: var(--tg-theme-secondary-bg-color, #ddd); color: var(--tg-theme-text-color, #000);">Отмена</button>
      <p class="error" id="keyError"></p>
    </div>
  </div>

  <!-- Экран деталей проекта -->
  <div id="detailView" class="view">
  <div class="card" id="detailCard">
    <h2 id="detailTitle">Проект</h2>
    <div id="metaBlock" class="add-row">
      <h3>О проекте</h3>
      <div class="add-row"><label>Название</label><input type="text" id="editName" placeholder="Название"></div>
      <div class="add-row"><label>Notion</label><input type="text" id="editNotion" placeholder="https://..."></div>
      <div class="add-row"><label>Статус</label><select id="editStatus">
        <option value="Development">Development</option>
        <option value="Ready">Ready</option>
        <option value="Moderation">Moderation</option>
        <option value="Product">Product</option>
        <option value="Ban">Ban</option>
      </select></div>
      <button id="saveMetaBtn">Сохранить</button>
      <p class="error" id="metaError"></p>
    </div>
    <div id="rulesBlock">
      <div id="rulesLoading" class="block-loading" style="display: none;"><div class="loading-spinner"></div><span>Загрузка правил…</span></div>
      <div id="rulesContent" style="display: none;">
        <div class="rules-row">
          <span>Правила (Чтение): <span id="readStatus" class="rules-status"></span></span>
          <button id="toggleReadBtn" style="margin-left: 8px;">Переключить</button>
        </div>
      </div>
      <p class="error" id="rulesError"></p>
    </div>
    <div id="dataBlock">
      <h3>Поля в корне</h3>
      <div id="dataLoading" class="block-loading" style="display: none;"><div class="loading-spinner"></div><span>Загрузка полей…</span></div>
      <div id="fieldsList"></div>
      <p class="error" id="dataError"></p>
    </div>
    <button id="deleteProjectBtn" class="btn-delete-project" type="button">Удалить проект</button>
  </div>
  <button id="backFromDetailBtn" style="margin-top: 12px;">Назад к списку</button>
  </div>

  <script>
    (function() {
      const Telegram = window.Telegram;
      if (!Telegram || !Telegram.WebApp) {
        document.getElementById('status').textContent = 'Откройте приложение из Telegram.';
        return;
      }
      Telegram.WebApp.ready();
      const initData = Telegram.WebApp.initData || '';
      if (!initData) {
        document.getElementById('status').textContent = 'Нет initData. Откройте из бота.';
        return;
      }

      const API_BASE = '';
      function headers() {
        const h = { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData };
        if (initData) h['Authorization'] = 'tma ' + initData;
        return h;
      }

      function api(method, path, body) {
        const opt = { method, headers: headers() };
        if (body !== undefined) opt.body = typeof body === 'string' ? body : JSON.stringify(body);
        return fetch(API_BASE + path, opt).then(async function(r) {
          if (r.status === 401) throw new Error('Откройте приложение из бота снова.');
          const ct = r.headers.get('Content-Type') || '';
          const data = ct.includes('application/json') ? await r.json() : await r.text();
          if (!r.ok) {
            var msg = (data && data.error) ? data.error : ('Ошибка ' + r.status);
            throw new Error(msg);
          }
          return data;
        });
      }

      const STATUSES = ['Development', 'Ready', 'Moderation', 'Product', 'Ban'];
      let projects = [];
      let selectedId = null;

      function setStatus(msg) {
        document.getElementById('status').textContent = msg || '';
      }

      function showView(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const el = document.getElementById(name + 'View');
        if (el) el.classList.add('active');
      }

      function getSelectedStatuses() {
        return STATUSES.filter(s => {
          const cb = document.querySelector('input[name="statusFilter"][value="' + s + '"]');
          return cb && cb.checked;
        });
      }

      function renderProjectsList() {
        const selected = getSelectedStatuses();
        const filtered = selected.length === 0 ? [] : projects.filter(p => selected.includes(p.status || 'Development'));
        const list = document.getElementById('projectsList');
        const emptyState = document.getElementById('emptyState');
        list.innerHTML = '';
        if (filtered.length === 0) {
          emptyState.style.display = 'block';
          emptyState.textContent = projects.length === 0
            ? 'Нет сохранённых проектов. Добавьте первый проект.'
            : 'Нет проектов, удовлетворяющих текущему фильтру.';
        } else {
          emptyState.style.display = 'none';
          list.innerHTML = filtered.map(p =>
            '<div class="project-item" data-id="' + escapeHtml(p.id) + '">' + escapeHtml(p.name || p.displayName || p.id) + ' <span class="status">(' + escapeHtml(p.status || '') + ')</span></div>'
          ).join('');
          list.querySelectorAll('.project-item').forEach(el => {
            el.addEventListener('click', () => { selectProject(el.dataset.id); showView('detail'); });
          });
        }
      }

      function loadProjects() {
        setStatus('Загрузка…');
        return api('GET', '/api/projects').then(data => {
          projects = data.projects || [];
          setStatus('');
          renderProjectsList();
        }).catch(err => {
          setStatus('Ошибка: ' + err.message);
        });
      }

      function selectProject(id) {
        selectedId = id;
        document.querySelectorAll('.project-item').forEach(el => {
          el.classList.toggle('selected', el.dataset.id === id);
        });
        const proj = projects.find(p => p.id === id);
        document.getElementById('detailTitle').textContent = 'Проект: ' + (proj && (proj.name || proj.displayName) ? (proj.name || proj.displayName) : id);
        if (proj) {
          document.getElementById('editName').value = proj.name || '';
          document.getElementById('editNotion').value = proj.notionUrl || '';
          document.getElementById('editStatus').value = proj.status || 'Development';
        }
        document.getElementById('metaError').textContent = '';
        loadRules(id);
        loadData(id);
      }

      document.getElementById('statusFilter').addEventListener('change', renderProjectsList);

      function resetCreateForm() {
        document.getElementById('bundleIdInput').value = '';
        document.getElementById('nameInput').value = '';
        document.getElementById('notionInput').value = '';
        document.getElementById('statusSelect').value = 'Development';
        document.getElementById('keyError').textContent = '';
        var fileInput = document.getElementById('keyFileInput');
        fileInput.value = '';
        var parent = fileInput.parentNode;
        var newInput = fileInput.cloneNode(true);
        parent.replaceChild(newInput, fileInput);
      }

      document.getElementById('goToAddBtn').addEventListener('click', () => {
        resetCreateForm();
        showView('create');
      });
      document.getElementById('backFromCreateBtn').addEventListener('click', () => showView('list'));
      document.getElementById('backFromDetailBtn').addEventListener('click', () => showView('list'));

      document.getElementById('deleteProjectBtn').addEventListener('click', () => {
        if (!selectedId) return;
        confirmAction('Удалить проект? Проект будет удалён из приложения.', function() {
          var btn = document.getElementById('deleteProjectBtn');
          btn.disabled = true;
          api('DELETE', '/api/projects/' + encodeURIComponent(selectedId))
            .then(function() {
              showView('list');
              loadProjects();
            })
            .catch(function(err) {
              document.getElementById('metaError').textContent = err.message;
            })
            .finally(function() { btn.disabled = false; });
        });
      });

      document.getElementById('saveMetaBtn').addEventListener('click', () => {
        if (!selectedId) return;
        const name = document.getElementById('editName').value.trim();
        const notionUrl = document.getElementById('editNotion').value.trim();
        const status = document.getElementById('editStatus').value;
        document.getElementById('metaError').textContent = '';
        api('PUT', '/api/projects/' + encodeURIComponent(selectedId), { name: name, notionUrl: notionUrl, status: status })
          .then(() => {
            const proj = projects.find(p => p.id === selectedId);
            if (proj) { proj.name = name; proj.notionUrl = notionUrl; proj.status = status; }
            renderProjectsList();
          })
          .catch(err => {
            document.getElementById('metaError').textContent = err.message;
          });
      });

      function loadRules(projectId) {
        document.getElementById('rulesError').textContent = '';
        document.getElementById('rulesLoading').style.display = 'flex';
        document.getElementById('rulesContent').style.display = 'none';
        api('GET', '/api/projects/' + encodeURIComponent(projectId) + '/rules')
          .then(data => {
            var statusEl = document.getElementById('readStatus');
            statusEl.textContent = data.read ? 'разрешено' : 'запрещено';
            statusEl.className = 'rules-status ' + (data.read ? 'rules-status--ok' : 'rules-status--deny');
            document.getElementById('rulesLoading').style.display = 'none';
            document.getElementById('rulesContent').style.display = 'block';
          })
          .catch(err => {
            document.getElementById('rulesError').textContent = err.message;
            document.getElementById('rulesLoading').style.display = 'none';
            document.getElementById('rulesContent').style.display = 'block';
          });
      }

      function loadData(projectId) {
        document.getElementById('dataError').textContent = '';
        document.getElementById('dataLoading').style.display = 'flex';
        document.getElementById('fieldsList').innerHTML = '';
        api('GET', '/api/projects/' + encodeURIComponent(projectId) + '/data')
          .then(data => {
            document.getElementById('dataLoading').style.display = 'none';
            const list = document.getElementById('fieldsList');
            if (typeof data !== 'object' || data === null) {
              list.innerHTML = '<p>Нет полей или данные не объект.</p>';
              return;
            }
            Object.keys(data).forEach(key => {
              const val = data[key];
              const str = typeof val === 'object' ? JSON.stringify(val) : String(val);
              const block = document.createElement('div');
              block.className = 'field-block';
              block.innerHTML =
                '<span class="field-name">' + escapeHtml(key) + '</span>' +
                '<textarea data-field="' + escapeHtml(key) + '" rows="4">' + escapeHtml(str) + '</textarea>' +
                '<div class="field-actions">' +
                  '<button type="button" class="btn-save">Сохранить</button>' +
                  '<button type="button" class="btn-clear">Очистить</button>' +
                '</div>';
              list.appendChild(block);
              block.querySelector('.btn-save').addEventListener('click', () => {
                const ta = block.querySelector('textarea');
                const saveBtn = block.querySelector('.btn-save');
                const clearBtn = block.querySelector('.btn-clear');
                confirmAction('Сохранить изменения?', function() {
                  saveBtn.disabled = true;
                  clearBtn.disabled = true;
                  saveField(projectId, ta.dataset.field, ta.value).finally(function() {
                    saveBtn.disabled = false;
                    clearBtn.disabled = false;
                  });
                });
              });
              block.querySelector('.btn-clear').addEventListener('click', () => {
                const ta = block.querySelector('textarea');
                const saveBtn = block.querySelector('.btn-save');
                const clearBtn = block.querySelector('.btn-clear');
                confirmAction('Очистить поле?', function() {
                  saveBtn.disabled = true;
                  clearBtn.disabled = true;
                  ta.value = '';
                  saveField(projectId, ta.dataset.field, '').finally(function() {
                    saveBtn.disabled = false;
                    clearBtn.disabled = false;
                  });
                });
              });
            });
            if (Object.keys(data).length === 0) list.innerHTML = '<p>Пусто.</p>';
          })
          .catch(err => {
            document.getElementById('dataLoading').style.display = 'none';
            document.getElementById('dataError').textContent = err.message;
          });
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function confirmAction(message, onOk) {
        if (window.Telegram && Telegram.WebApp && typeof Telegram.WebApp.showConfirm === 'function') {
          Telegram.WebApp.showConfirm(message, function(ok) { if (ok) onOk(); });
        } else {
          if (window.confirm(message)) onOk();
        }
      }

      function saveField(projectId, fieldName, value) {
        let valueJson = value.trim();
        if (!valueJson.startsWith('{') && !valueJson.startsWith('[') && valueJson !== 'null') {
          if (valueJson === 'true' || valueJson === 'false') valueJson = valueJson;
          else if (/^-?\d+(\.\d+)?$/.test(valueJson)) valueJson = valueJson;
          else valueJson = JSON.stringify(valueJson);
        }
        document.getElementById('dataError').textContent = '';
        return api('PUT', '/api/projects/' + encodeURIComponent(projectId) + '/data/' + encodeURIComponent(fieldName), valueJson)
          .then(() => loadData(projectId))
          .catch(err => {
            document.getElementById('dataError').textContent = err.message;
          });
      }

      document.getElementById('addKeyBtn').addEventListener('click', () => {
        const bundleIdInput = document.getElementById('bundleIdInput');
        const fileInput = document.getElementById('keyFileInput');
        const errEl = document.getElementById('keyError');
        const bundleId = bundleIdInput.value.trim();
        const file = fileInput.files && fileInput.files[0];
        errEl.textContent = '';
        if (!file) {
          errEl.textContent = 'Выберите JSON-файл ключа.';
          return;
        }
        document.getElementById('addKeyBtn').disabled = true;
        const reader = new FileReader();
        reader.onload = () => {
          const key = (reader.result || '').toString().trim();
          if (!key) {
            errEl.textContent = 'Файл пустой.';
            document.getElementById('addKeyBtn').disabled = false;
            return;
          }
          const name = document.getElementById('nameInput').value.trim();
          const notionUrl = document.getElementById('notionInput').value.trim();
          const status = document.getElementById('statusSelect').value;
          const body = { key: key, status: status };
          if (bundleId) body.bundleId = bundleId;
          if (name) body.name = name;
          if (notionUrl) body.notionUrl = notionUrl;
          api('POST', '/api/projects', body)
            .then(() => {
              document.getElementById('bundleIdInput').value = '';
              document.getElementById('nameInput').value = '';
              document.getElementById('notionInput').value = '';
              document.getElementById('statusSelect').value = 'Development';
              fileInput.value = '';
              showView('list');
              loadProjects();
            })
            .catch(err => {
              errEl.textContent = err.message;
            })
            .finally(() => { document.getElementById('addKeyBtn').disabled = false; });
        };
        reader.onerror = () => {
          errEl.textContent = 'Не удалось прочитать файл.';
          document.getElementById('addKeyBtn').disabled = false;
        };
        reader.readAsText(file, 'UTF-8');
      });

      document.getElementById('toggleReadBtn').addEventListener('click', () => {
        if (!selectedId) return;
        var btn = document.getElementById('toggleReadBtn');
        btn.disabled = true;
        document.getElementById('rulesError').textContent = '';
        api('GET', '/api/projects/' + encodeURIComponent(selectedId) + '/rules')
          .then(data => {
            const newRead = !data.read;
            return api('PUT', '/api/projects/' + encodeURIComponent(selectedId) + '/rules', { read: newRead });
          })
          .then(() => loadRules(selectedId))
          .catch(err => {
            document.getElementById('rulesError').textContent = err.message;
          })
          .finally(() => { btn.disabled = false; });
      });

      loadProjects();
    })();
  </script>
</body>
</html>
